name: Gerar APK RUNDEAFIX FIRE CE RUN

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto Android
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "ZIP encontrado: $ZIP"
          unzip -o "$ZIP" -d extracted

      - name: Encontrar projeto Android
        run: |
          PROJECT=$(find extracted -name "settings.gradle" -type f -printf '%h\n' | head -n 1)
          echo "Projeto encontrado em: $PROJECT"
          echo "ANDROID_PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Compilar APK
        run: |
          cd "$ANDROID_PROJECT"
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RUNDEAFIX-FIRE-CE-RUN-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
